# Wi-Fi through iwd instead of wpa_supplicant.
# Needs the iwd package (see packages.txt) and, on a new install:
#   sudo systemctl disable --now wpa_supplicant.service
# Install (root):
#   sudo install -Dm644 system-files/NetworkManager/conf.d/wifi_backend.conf \
#        /etc/NetworkManager/conf.d/wifi_backend.conf
#   sudo systemctl restart NetworkManager

[device]
wifi.backend=iwd
