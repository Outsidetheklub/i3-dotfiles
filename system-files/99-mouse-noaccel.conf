# Disable mouse acceleration for ALL pointer devices, permanently.
# Applies on hotplug (device reconnection) and on login — no scripts needed.
# libinput "flat" profile = 1:1 cursor movement, no acceleration.
Section "InputClass"
    Identifier "no mouse acceleration"
    MatchIsPointer "on"
    Driver "libinput"
    Option "AccelProfile" "flat"
EndSection
