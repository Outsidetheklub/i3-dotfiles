# i3 session + greeter for LightDM. A drop-in, so the package's
# /etc/lightdm/lightdm.conf itself stays untouched.
#
# Install (root):
#   sudo install -Dm644 system-files/lightdm/50-i3.conf \
#        /etc/lightdm/lightdm.conf.d/50-i3.conf

[Seat:*]
greeter-session=lightdm-gtk-greeter
user-session=i3
greeter-hide-users=false

# The greeter draws on the X server's *primary* monitor, which is not always the
# one you want (the nvidia driver's MetaMode carries no refresh rate, so it can
# land on the wrong screen at 60 Hz). Per-machine fix:
#   sudo install -Dm755 examples/lightdm-display-setup.sh /usr/local/bin/lightdm-display-setup.sh
# then uncomment this:
#display-setup-script=/usr/local/bin/lightdm-display-setup.sh

# Greeter on a specific monitor instead — put this under [greeter] in
# /etc/lightdm/lightdm-gtk-greeter.conf (not in this file):
#   active-monitor=<output>      # xrandr output name, e.g. DP-4
#   active-monitor=#cursor       # ...or "wherever the mouse is"
