shell fish

# Font: Noto Sans Mono 11 (2026-10-23) — the stock fontconfig `monospace` face.
# Named explicitly so kitty doesn't depend on whatever fontconfig prefers that
# day. (The Terminus pass of 2026-09-29 was reverted: 13pt there ≈ 11pt here.)
# The "Mono" variant has 1-cell-wide glyphs, which is what a terminal wants;
# drop "Mono" for double-width icons.
font_family Noto Sans Mono
font_size 11

# niri (and i3 with default_border none) leaves decorations to clients;
# hide kitty's CSD title bar
hide_window_decorations yes
