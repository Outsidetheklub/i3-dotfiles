shell fish

# Font: Terminus (the classic console face), added 2026-09-29.
# It's in ~/.local/share/fonts/terminess/ as a *user* font (the nerd-fonts
# patched "Terminess Nerd Font Mono"; the upstream `ttf-terminus-nerd` package is
# the same family, so a fresh box can get it from packages.txt).
# 13pt here ≈ the footprint the old fontconfig `monospace` (Noto Sans Mono) had
# at 11pt — Terminus renders smaller than Noto at equal pt. Use 11 for the
# denser, more console-like look. The "Mono" variant has 1-cell-wide glyphs,
# which is what a terminal wants; drop "Mono" for double-width icons.
font_family Terminess Nerd Font Mono
font_size 13

# niri (and i3 with default_border none) leaves decorations to clients;
# hide kitty's CSD title bar
hide_window_decorations yes
