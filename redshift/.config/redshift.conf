[redshift]
; Temperature settings (lower = warmer)
temp-day=6500
temp-night=3000

; Smooth transition time in minutes
transition=1

; Gamma correction
gamma=1.0

; Location provider: manual, geoclue2, etc.
; NOTE: the coordinates are deliberately NOT here — they're machine-specific.
; Set REDSHIFT_LOCATION in ~/.config/i3/machine.env (see examples/machine.env);
; startup.sh passes it with -l and skips redshift entirely when it's unset.
location-provider=manual

[manual]
; lat/lon come from -l on the command line.
