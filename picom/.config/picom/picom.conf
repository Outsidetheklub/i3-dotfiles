# picom — the compositor, here for VSync only.
#
# i3 is not a compositor, so on X11 nothing syncs window output to the display
# refresh and windowed content tears. picom does the syncing. No shadows, blur,
# rounded corners or fading: the look stays stock/black — this file exists to
# stop the tearing, not to decorate.
#
# Started from ~/.config/i3/startup.sh (guarded, so reloading i3 won't stack).

backend = "xrender";   # Intel/modesetting: most reliable VSync. "glx" is
                       # lighter on the CPU — try it if xrender costs too much
                       # battery, but its VSync is flakier on Intel.
vsync = true;

shadow = false;
fading = false;

# Keep fullscreen windows redirected so they stay composited (and therefore
# VSync'd). Unredirecting them is exactly what hands the tearing back.
unredir-if-possible = false;
