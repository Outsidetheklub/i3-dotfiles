# Machine-specific i3 config — this file is NOT tracked in the repo.
# It is included at the end of the shared i3 config, and it is where anything
# that differs between machines goes: monitor names, workspace→output mapping,
# output-specific keybinds, machine-only autostart lines.
#
# If this file is missing, i3 starts normally — you just get no output bindings.
#
# ── How to fill it in ────────────────────────────────────────────────────────
# 1) Find your output names:      xrandr --query | grep ' connected'
# 2) Replace OUTPUT1 / OUTPUT2 below with them.
# 3) Reload i3: $mod+Shift+c

# ── Example: two monitors (desktop) ─────────────────────────────────────────
# OUTPUT1 = DP-4   (main, primary)      workspaces 1-5
# OUTPUT2 = HDMI-0 (secondary, right)   workspaces 6-10
#
# workspace 1 output OUTPUT1
# workspace 2 output OUTPUT1
# workspace 3 output OUTPUT1
# workspace 4 output OUTPUT1
# workspace 5 output OUTPUT1
# workspace 6 output OUTPUT2
# workspace 7 output OUTPUT2
# workspace 8 output OUTPUT2
# workspace 9 output OUTPUT2
# workspace 10 output OUTPUT2
#
# bindsym $mod+Shift+Left  move container to output OUTPUT1, focus output OUTPUT1
# bindsym $mod+Shift+Right move container to output OUTPUT2, focus output OUTPUT2

# ── Example: laptop, single screen ──────────────────────────────────────────
# Nothing needed at all — workspaces land on the only output. If you plug in an
# external screen, add a second output block above.
