[Settings]
# GTK3 theme: adw-gtk3-dark (package: adw-gtk-theme) — the GTK3 backport of the
# libadwaita look. Unlike Adwaita-dark (whose CSS is *generated* with literal
# colours, so @define-color is ignored), this one is variable-based, which is
# what makes the greyscale palette in gtk.css reach GTK3 apps.
# Changed from Adwaita-dark on 2026-09-23.
gtk-theme-name=adw-gtk3-dark
gtk-application-prefer-dark-theme=true
# Terminus (classic console face) — 12pt here ≈ 10pt of the old
# FiraCode Nerd Font by width; see kitty.conf.
gtk-font-name=Terminess Nerd Font Mono 12
# Icons: Papirus-Dark with WHITE folders (the Papirus default is blue). The
# recolour rewrites /usr/share/icons, so it isn't a config file: run
# `sudo papirus-folders -C white --theme Papirus-Dark` (papirus-folders-git,
# AUR) — install.sh does it, and re-run it after a Papirus update.
gtk-icon-theme-name=Papirus-Dark
# Cursor theme (2026-09-28): keep in sync with XCURSOR_THEME in ~/.xprofile.
# NB: "breeze-mono-light" nominal 24 = 32px real (Breeze declares sizes at 3/4).
gtk-cursor-theme-name=breeze-mono-light
gtk-cursor-theme-size=24
gtk-enable-event-sounds=0
gtk-enable-input-feedback-sounds=0
