[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-application-prefer-dark-theme=true
gtk-font-name=FiraCode Nerd Font 10
# Icons: Papirus-Dark + WHITE folders (Papirus ships blue) — matches the GTK3
# file. Recolour: sudo papirus-folders -C white --theme Papirus-Dark
gtk-icon-theme-name=Papirus-Dark
# Cursor theme (2026-09-28): keep in sync with ~/.xprofile. (“breeze-mono-light” nominal 24 = 32px real.)
gtk-cursor-theme-name=breeze-mono-light
gtk-cursor-theme-size=24
