<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Crisp monospace rendering (2026-10-23).

     WHY: when the desktop went from Terminus back to stock Noto Sans Mono, the
     bar/terminal text read as "blurry and stretched". Nothing was scaled — the
     cause was antialiasing: a bar crop had 195 distinct grey levels, i.e. every
     stem was smeared over 2-3px. Terminus (the previous font) had pixel-aligned
     1px stems, which is the crisp look he wanted back.

     SCOPE: monospace families only. GTK widgets (Noto Sans), rofi and the
     browser keep normal antialiased rendering — this rule does not touch them.

     hintfull + autohint off snaps stems to the pixel grid; antialias off then
     gives hard edges (x2 colours in the bar instead of ~200). rgba=none because
     there is no subpixel (LCD) rendering anywhere in this setup.

     NOTES:
       - fontconfig + cairo ignore Xft.* resources here (i3bar/Pango proved it:
         an xrdb Xft.hintstyle merge changed nothing), so it has to be a
         fontconfig rule — not ~/.Xresources.
       - apps read this at startup: `fc-cache -f` after editing, then restart the
         app (i3bar: `i3-msg restart`, kitty: new window).
       - To go back to soft text: delete this file and `fc-cache -f`.
-->
<fontconfig>
  <match target="font">
    <test name="family" compare="contains">
      <string>Noto Sans Mono</string>
    </test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
