<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Crisp, non-antialiased Noto text (2026-10-23).

     WHY: when the desktop went from Terminus back to stock Noto Sans / Noto Sans
     Mono, the text read as "blurry and stretched". Nothing was scaled — the cause
     was antialiasing: a bar crop had 195 distinct grey levels, i.e. every stem was
     smeared over 2-3px. Terminus (the previous font) had pixel-aligned 1px stems,
     which is the crisp look he wanted back.

     SCOPE: monospace only (kitty, the i3 WM font, i3bar) — where it was asked
     for. Widgets (GTK3/GTK4, Thunar, rofi) and browser text keep stock
     antialiased rendering: he tried the whole-UI version on 2026-10-23 and it
     read as "too crisp", almost italic/sharp, so it was reverted the same hour.
     If a middle ground is ever wanted, a second match block on family
     "Noto Sans" with antialias TRUE + hintstyle hintfull is the softer step.

     hintfull + autohint off snaps stems to the pixel grid; antialias off then
     gives hard edges (2 colours in the bar instead of ~200). rgba=none because
     there is no subpixel (LCD) rendering anywhere in this setup.

     NOTES:
       - fontconfig + cairo ignore Xft.* resources here (i3bar/Pango proved it: an
         xrdb Xft.hintstyle merge changed nothing), so it has to be a fontconfig
         rule — not ~/.Xresources.
       - apps read this at startup: `fc-cache -f` after editing, then restart the
         app (i3bar: `i3-msg restart`, kitty: new window, GTK apps: relaunch).
       - Aliased text gets chunky at large sizes (a terminal zoomed to 20pt+).
         If that ever bothers him, add a size guard to the match block:
           <test name="pixelsize" compare="less_eq"><double>18</double></test>
       - To go back to soft text: delete this file and `fc-cache -f`.
-->
<fontconfig>
  <!-- Monospace: terminal + bar -->
  <match target="font">
    <test name="family" compare="eq">
      <string>Noto Sans Mono</string>
    </test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>

</fontconfig>
